<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discollection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calme et nocturne, une pochette éclairée dans une pièce sombre
   IDEA: le bac du disquaire, et la fiche qu'on glisse dans chaque pochette
   PICTURE: le bac de pochettes empilées, celle qu'on sort levée au-dessus des autres
   COLOUR and TYPE: noir #0a0a0a, crème #efe6d2, gris chauds ; Instrument Serif + Inter 300 ; les pochettes seules en couleur
   LAYOUT: barre latérale au-dessus de 900px, onglets en bas sur téléphone, colonne de 1100px */
:root{color-scheme:dark;--bg:#0a0a0a;--ink:#efe6d2;--mut:#a89f8e;--dim:#8a8274;--line:#2a2826;--soft:#1d1c1a;--card:#111110;--serif:'Instrument Serif',Georgia,serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;padding:20px max(4vw,18px) 120px;max-width:1140px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(4vw,18px) 0}
.brand{font-family:var(--serif);font-size:26px;text-decoration:none;letter-spacing:-.01em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:8px 8px calc(14px + env(safe-area-inset-bottom));background:rgba(10,10,10,.96);border-top:1px solid var(--soft)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;min-height:48px;justify-content:center;text-decoration:none;color:var(--dim);font-size:12px}
.tab[aria-current=page]{color:var(--ink);font-weight:500}
.tab svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
@media(min-width:900px){
 .top,.tabs{display:none}
 .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;padding:30px 22px;border-right:1px solid var(--soft);position:sticky;top:0;height:100vh}
 .side .brand{margin-bottom:26px}
 .nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:999px;text-decoration:none;color:var(--dim)}
 .nav[aria-current=page]{color:var(--ink);background:var(--card)}
 .side .credit{margin-top:auto}
 main{padding:40px 48px 80px}
}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,6vw,56px);letter-spacing:-.02em}
h2{font-size:clamp(28px,3.4vw,34px)}
i.s{font-style:italic}
.lab{font-size:13px;color:var(--mut);margin:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#0a0a0a;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid #3a3733;background:transparent;font-size:14px;text-decoration:none;white-space:nowrap}
.btn2[disabled],.btn[disabled]{opacity:.4;cursor:not-allowed}
.ico{width:46px;height:46px;border-radius:50%;border:1px solid #3a3733;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico.on{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.pill[aria-pressed=true],.pill[aria-checked=true]{background:var(--ink);color:#0a0a0a;border-color:var(--ink);font-weight:500}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--soft)}
.rowl{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0;text-decoration:none}
.cv{position:relative;overflow:hidden;border-radius:2px;background:#1a1918;flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid2{display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.sec{margin-top:44px}
.field{display:block;margin-top:14px}
.field>span:first-child{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.in{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
textarea.in{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.55}
.in:focus{border-color:#5a554d}
.stars{display:flex;margin-left:-8px}
.stars button{width:46px;height:46px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.stars svg{width:26px;height:26px;stroke:var(--ink);stroke-width:1.3}
.bpm{font-family:var(--serif);font-size:clamp(64px,12vw,96px);line-height:.85}
.panel{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-top:22px}
.stage{position:relative;width:100%;max-width:480px;margin:0 auto;padding:84px 0 8px;outline:none}
.amb{position:absolute;left:4%;right:4%;top:22%;bottom:-6%;filter:blur(70px) saturate(1.4);opacity:.45;pointer-events:none;overflow:hidden;border-radius:50%}
.amb>*{width:100%;height:100%;object-fit:cover;display:block}
.stack{position:relative;width:76%;aspect-ratio:1;margin-left:4%}
.sl{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:#1a1918;display:block}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:translateY(calc(var(--j) * -19px)) scale(calc(1 - var(--j) * .05));transform-origin:50% 0;filter:brightness(calc(.6 - var(--j) * .1));z-index:calc(10 - var(--j));box-shadow:0 -4px 14px rgba(0,0,0,.6)}
.disc{position:absolute;top:3%;bottom:3%;aspect-ratio:1;right:-25%;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0c 0 1px,#1b1a19 1px 3px);box-shadow:0 0 0 1px #2a2826,0 20px 40px rgba(0,0,0,.6);z-index:11;animation:discOut .7s cubic-bezier(.2,.8,.2,1)}
.disc::after{content:'';position:absolute;inset:2%;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 14%,rgba(239,230,210,.10) 20%,transparent 27% 63%,rgba(239,230,210,.07) 70%,transparent 77%);box-shadow:inset 0 0 0 1px rgba(239,230,210,.08)}
.disc span{position:absolute;inset:34%;border-radius:50%;overflow:hidden;background:#1a1918}
.disc span img{width:100%;height:100%;object-fit:cover}
.disc i{position:absolute;inset:48.5%;border-radius:50%;background:#0a0a0a;z-index:1}
.front2{z-index:12;box-shadow:0 40px 80px rgba(0,0,0,.8),0 0 0 1px rgba(239,230,210,.06);transition:transform .25s ease}
.front2:hover{transform:translateY(-6px)}
.front2.next{animation:fromBack .45s cubic-bezier(.2,.8,.2,1)}
.front2.prev{animation:fromFront .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fromBack{from{transform:translateY(-22px) scale(.95);filter:brightness(.6)}to{transform:none;filter:none}}
@keyframes fromFront{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes discOut{from{transform:translateX(-32%)}to{transform:none}}
.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 26px}
.bin{display:block;text-decoration:none;outline-offset:6px}
.binv{position:relative;aspect-ratio:1;margin:46px 7% 0}
.bk{transform:translateY(calc(var(--j) * -13px)) scale(calc(1 - var(--j) * .05));transform-origin:50% 0;filter:brightness(calc(.62 - var(--j) * .12));z-index:calc(10 - var(--j))}
.bf{z-index:12;box-shadow:0 26px 50px rgba(0,0,0,.8);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.bin:hover .bf,.bin:focus-visible .bf{transform:translateY(-16px)}
.binn{font:400 25px/1.1 var(--serif)}
@media(max-width:600px){.bins{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}.binv{margin-top:34px}.binn{font-size:19px}.binf{padding-bottom:9px}.bk{transform:translateY(calc(var(--j) * -9px)) scale(calc(1 - var(--j) * .05))}}
.binf{position:absolute;left:-8%;right:-8%;bottom:-1px;height:34%;z-index:13;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 6% 12px;background:var(--bg);border-top:1px solid #3a3733}
body.ob .side,body.ob .tabs,body.ob .top{display:none}
body.ob main{max-width:540px;padding:max(4vh,22px) 22px 64px}
.obhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;min-height:46px}
.fan{position:relative;height:250px;margin:6px 0 26px}
.fan .sl{inset:auto;left:50%;top:34px;width:170px;height:170px;margin-left:-85px;box-shadow:0 24px 50px rgba(0,0,0,.85);transform:translateX(calc(var(--k) * 58px)) rotate(calc(var(--k) * 7deg));transform-origin:50% 130%;filter:brightness(calc(1 - (var(--k) * var(--k)) * .09))}
.obb{display:grid;gap:10px;margin-top:26px}
.obb .btn,.obb .btn2{width:100%;min-height:54px;font-size:15px}
.linkb{display:block;margin:16px auto 0;min-height:44px;background:none;border:0;color:var(--mut);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.err{color:#ff9f8f;font-size:14px;margin:12px 0 0}.err:empty{display:none}
.steps{display:flex;gap:6px}.steps span{flex:1;height:2px;background:var(--line)}.steps span.on{background:var(--ink)}
.howto{margin:16px 0 0;padding-left:22px;line-height:1.5}.howto li{margin:7px 0}.howto a{text-underline-offset:3px}
.bar{height:2px;background:var(--line);margin-top:16px}.bar i{display:block;height:2px;background:var(--ink);transition:width .3s}
.pw{position:relative;display:block}.pw .in{padding-right:96px}
.pwt{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--mut);font-size:13px}
.avatar{width:64px;height:64px;border-radius:50%;border:1px solid #3a3733;display:flex;align-items:center;justify-content:center;font:400 28px var(--serif);flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.fan .sl{width:150px;height:150px;margin-left:-75px;transform:translateX(calc(var(--k) * 44px)) rotate(calc(var(--k) * 7deg))}.fan{height:224px}}
#modeTag a{color:var(--mut);text-underline-offset:3px}
.tabs .tab{min-width:64px}
.nfil{display:flex;flex-wrap:wrap;gap:16px 36px;margin-top:24px}.nfil .field{flex:1 1 100%}
.ss-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.ss-stats{display:flex;gap:clamp(18px,4vw,44px);margin:0}
.ss-stats div{display:flex;flex-direction:column-reverse}.ss-stats dt{font-size:13px;color:var(--dim)}.ss-stats dd{margin:0;font:400 clamp(34px,5vw,52px)/1 var(--serif)}
.ss-curve{position:relative;margin:26px 0 0;height:150px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ss-curve svg{position:absolute;inset:0;width:100%;height:100%;font-family:Inter,sans-serif}
.ss-grid{display:grid;gap:clamp(28px,4vw,56px);margin-top:30px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.ss-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.setl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.setl li{display:grid;grid-template-columns:30px 26px 46px 52px minmax(0,1fr) 54px 56px 40px;gap:10px;align-items:center;min-height:70px;border-bottom:1px solid var(--soft);background:var(--bg);transition:transform .15s ease}
.setl li.drag{transition:none;z-index:5;position:relative;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.7);border-radius:10px;outline:1px solid #3a3733}
.ss-f{display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;border:1px solid #3a3733;border-radius:8px;line-height:1}.ss-f b{font:400 22px/1 var(--serif);white-space:nowrap}.ss-f span{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.ss-n{font:400 20px var(--serif);color:var(--dim);text-align:center}
.ss-t{text-decoration:none;min-width:0}
.ss-b,.ss-d{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.ss-b b{font:400 26px/1 var(--serif)}.ss-d>span:first-child{font-size:14px}
.ss-dur{border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:6px 6px;margin:-6px -6px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}.ss-dur:hover,.ss-dur:focus-visible{background:var(--card)}.ss-dur.own{text-decoration:underline dotted;text-underline-offset:3px}.ss-dur.add{color:var(--dim);font-size:12px;white-space:nowrap}.ss-din{width:56px;background:var(--card);color:var(--ink);border:1px solid var(--dim);border-radius:8px;padding:5px 6px;font:inherit;font-size:14px;text-align:right}
.pv{border:0;cursor:pointer;color:var(--ink);font:inherit;padding:0;position:relative}
.pvr{width:38px;height:38px;flex:none;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px var(--dim);display:flex;align-items:center;justify-content:center;background-image:conic-gradient(var(--ink) calc(var(--p,0)*360deg),transparent 0);transition:box-shadow .15s}
.pvr .pvi{display:flex;width:32px;height:32px;border-radius:50%;background:var(--bg);align-items:center;justify-content:center}
.pvr:hover,.pvr.on{box-shadow:inset 0 0 0 1px var(--ink)}.pvbig{width:52px;height:52px}.pvbig .pvi{width:46px;height:46px}.pvbig svg{width:18px;height:18px}
.pvc{background:none;display:block;line-height:0}.pvc .pvi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
.pvc:hover .pvi,.pvc:focus-visible .pvi,.pvc.on .pvi,.pvc.busy .pvi{opacity:1}.pvc::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--ink)}
@media(hover:none){.pvc .pvi{opacity:1;background:rgba(0,0,0,.35)}}
.pv-none{cursor:default}.pvr.pv-none,.pvr.pv-none:hover{box-shadow:none;border:1px dashed var(--dim);color:var(--dim);opacity:.7}.pvr.pv-none .pvi{background:transparent}.pvr.pv-none svg{width:16px;height:16px}
.pvc.pv-none .pvi{opacity:1;background:rgba(0,0,0,.55);color:var(--dim)}
.pvr.pv-unk{color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}.pv-unk .pvi svg{animation:pvb 1.4s ease-in-out infinite}
.pv.busy .pvi svg{animation:pvb 1s ease-in-out infinite}@keyframes pvb{50%{opacity:.25}}
.dur-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.ss-x{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center}.ss-x:hover{color:var(--ink);background:var(--card)}
.grip{width:30px;height:46px;border:0;background:transparent;color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grip svg{fill:currentColor}.grip:active{cursor:grabbing;color:var(--ink)}
.ss-side{align-self:start}
.ss-discs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:18px 14px}
.ss-empty{margin-top:28px;padding:32px;border:1px dashed #3a3733;border-radius:18px}
@media(max-width:600px){.setl li{grid-template-columns:22px 38px 46px minmax(0,1fr) 38px 46px 30px;gap:6px}.setl .ss-n{display:none}.setl .pvc .cv{width:38px!important;height:38px!important}.ss-f b{font-size:20px}.ss-dur.add{font-size:11px}.ss-stats dd{font-size:32px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(92vw,520px);text-align:center;background:var(--ink);color:#0a0a0a;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(min-width:900px){.toast{bottom:32px}}
.listen{position:relative;width:200px;height:200px;margin:20px auto}
.listen i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--ink);animation:ring 2.4s ease-out infinite}
.listen i:nth-child(2){animation-delay:.8s}.listen i:nth-child(3){animation-delay:1.6s}
.listen b{position:absolute;inset:64px;border-radius:50%;background:var(--ink);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font:400 28px var(--serif)}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.tapbox{width:100%;min-height:120px;border-radius:16px;border:1px dashed #5a554d;background:var(--card);font-size:15px}
.tapbox:active{background:#1a1918}
.credit{font-size:12px;color:var(--dim);line-height:1.5}
.credit a{color:var(--mut)}
.note{font-size:13px;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico[disabled]{opacity:.3;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<script>
{

  pages = (j.pagination && j.pagination.pages) || 1; const total = (j.pagination && j.pagination.items) || 0;
  for (const it of j.releases || []) {
   const b = it.basic_information || {}, lab = (b.labels || [])[0] || {};
   out.push({ id:'r' + b.id, did:b.id, a:(b.artists || []).map(x => String(x.name).replace(/ \(\d+\)$/, '')).join(', '), t:b.title || '', y:b.year || '', l:[lab.name, lab.catno].filter(Boolean).join(' · '), g:(b.genres || [])[0] || 'Divers', st:(b.styles || [])[0] || '', ln:lab.name || '', img:b.cover_image || b.thumb || '', tr:null });

const isVarious = r => /^various\b/i.test(String(r.a || '').trim());

  let st = 0, d = '';
  try { const c = error.context; if (c) { st = c.status || 0; const j = await c.clone().json().catch(() => null); d = j ? (j.error || j.message || j.msg || '') : ''; } } catch (e) {}

/* ---------- Détection du tempo ---------- */
async function analyze(ab){
 const AC = window.AudioContext || window.webkitAudioContext;
 const ac = new AC(); const buf = await ac.decodeAudioData(ab); if (ac.close) ac.close();
 const sr = buf.sampleRate, len = Math.min(buf.length, Math.round(sr * 40));
 const off = new OfflineAudioContext(1, len, sr), src = off.createBufferSource(), lp = off.createBiquadFilter();
 src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 200; src.connect(lp); lp.connect(off.destination); src.start(0);
 const d = (await off.startRendering()).getChannelData(0);
 const rate = 200, hop = Math.round(sr / rate), n = Math.floor(d.length / hop);
 if (n < rate * 4) throw new Error('Enregistrement trop court (4 s minimum)');
 const e = new Float32Array(n);
 for (let i = 0; i < n; i++) { let s = 0; for (let j = i * hop, z = j + hop; j < z; j++) s += d[j] * d[j]; e[i] = Math.log(1e-8 + s); }
 const on = new Float32Array(n); let mean = 0;
 for (let i = 2; i < n; i++) { on[i] = Math.max(0, e[i] - (e[i - 1] + e[i - 2]) / 2); mean += on[i]; }
 mean /= n; for (let i = 0; i < n; i++) on[i] -= mean;
 const lo = Math.floor(rate * 60 / 180), hi = Math.ceil(rate * 60 / 55), ac2 = [];
 let best = lo, bv = -Infinity, sum = 0;
 for (let L = lo; L <= hi; L++) {
  let s = 0; for (let i = 0; i + L < n; i++) s += on[i] * on[i + L];
  const bpm = rate * 60 / L, w = Math.exp(-0.5 * (Math.log2(bpm / 100) / 0.9) ** 2);
  ac2[L] = s; sum += s; if (s * w > bv) { bv = s * w; best = L; }
 }
 const a = ac2[best - 1] ?? ac2[best], b = ac2[best], c = ac2[best + 1] ?? ac2[best];
 const shift = (a - 2 * b + c) ? 0.5 * (a - c) / (a - 2 * b + c) : 0;
 const bpm = rate * 60 / (best + shift), conf = b / (sum / (hi - lo + 1) || 1);
 return { b: Math.round(bpm), alt: Math.round(bpm < 95 ? bpm * 2 : bpm / 2), conf: conf > 2.2 ? 'élevée' : conf > 1.5 ? 'moyenne' : 'faible' };
}
async function recordMic(sec, tick){

  <div class="ss-empty"><p class="mut" style="margin:0;max-width:44ch">Ton set est vide. Choisis tes titres dans tes notes avec le bouton +, puis range-les ici dans l’ordre de passage.</p><a class="btn" href="#notes" style="margin-top:22px">Choisir dans mes notes</a></div>`;

 ${bp.length > 1 ? `<figure class="ss-curve" aria-label="Courbe du tempo, de ${bp[0]} à ${bp[bp.length - 1]} BPM"><svg id="curve" role="img" aria-hidden="true"></svg></figure>` : ''}
 <div class="ss-grid">

   <p class="note" style="margin:0 0 10px">Glisse un titre par sa poignée pour changer l’ordre. Au clavier : flèches haut et bas sur la poignée.</p>
   <ol class="setl" id="setl">${chosen.map((x, i) => { const prev = i ? chosen[i - 1].n.b : 0, dlt = prev && x.n.b ? x.n.b - prev : 0; return `<li data-k="${esc(x.k)}">
    <button class="grip" aria-label="Déplacer ${esc(x.t.n)}, position ${i + 1} sur ${chosen.length}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></button>
    <span class="ss-n">${i + 1}</span>
    ${pvBtn(x.k, 'pvc', x.t.n, cover(x.r, 46))}
    <span class="ss-f" aria-label="Face ${esc(x.t.p || 'inconnue')}"><b>${esc(x.t.p || '?')}</b><span>face</span></span>
    <a class="ss-t" href="#titre-${esc(x.r.id)}-${x.i}"><span class="ell" style="display:block;font-size:16px;font-weight:400">${esc(x.t.n)}</span><span class="ell small mut" style="display:block">${esc(x.t.a || x.r.a)} · ${esc(x.r.t)}</span></a>
    <span class="ss-b"><b>${x.n.b || '—'}</b><span class="small dim">${dlt ? (dlt > 0 ? '+' : '') + dlt : 'BPM'}</span></span>
    <span class="ss-d">${durOf(x.t, x.n) ? `<button class="ss-dur${x.n.dm > 0 ? ' own' : ''}" data-k="${esc(x.k)}" aria-label="Durée de ${esc(x.t.n)} : ${esc(durOf(x.t, x.n))}. Modifier">${esc(durOf(x.t, x.n))}</button>` : `<button class="ss-dur add" data-k="${esc(x.k)}" aria-label="Ajouter la durée de ${esc(x.t.n)}">+ durée</button>`}</span>
    <button class="ss-x" data-k="${esc(x.k)}" aria-label="Retirer ${esc(x.t.n)} du sound system"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
   </li>`; }).join('')}</ol>
  </section>
  <aside class="ss-side">

 </div>`;
 const svg = $('#curve');
 if (svg) {
  const drawCurve = () => {
   const W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
   const pts = chosen.map((x, i) => ({ i, b: x.n.b })).filter(p => p.b);
   const mn = Math.min(...pts.map(p => p.b)) - 4, mx = Math.max(...pts.map(p => p.b)) + 4, pad = 24;
   const X = i => pad + (chosen.length > 1 ? i * (W - pad * 2) / (chosen.length - 1) : (W - pad * 2) / 2), Y = b => H - 28 - (b - mn) / (mx - mn || 1) * (H - 56);
   const path = pts.map((p, j) => (j ? 'L' : 'M') + X(p.i).toFixed(1) + ' ' + Y(p.b).toFixed(1)).join(' ');
   const small = W < 520;
   svg.innerHTML = `<path d="${path}" fill="none" stroke="#efe6d2" stroke-width="1.5" stroke-linejoin="round"/>` + pts.map(p => `<circle cx="${X(p.i)}" cy="${Y(p.b)}" r="4" fill="#0a0a0a" stroke="#efe6d2" stroke-width="1.5"/>${small ? '' : `<text x="${X(p.i)}" y="${Y(p.b) - 12}" text-anchor="middle" fill="#a89f8e" font-size="12">${p.b}</text>`}`).join('') + chosen.map((x, i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" fill="#6b655b" font-size="11">${i + 1}</text>`).join('');
  };
  curveObs = new ResizeObserver(drawCurve); curveObs.observe(svg);
 }
 const rerender = (focusIdx) => { const y = scrollY; vSound(); scrollTo(0, y); if (focusIdx != null) { const g = document.querySelectorAll('#setl .grip')[focusIdx]; if (g) g.focus(); } };
 const moveSet = (from, to, focus) => { const keys = chosen.map(x => x.k); const [k] = keys.splice(from, 1); keys.splice(to, 0, k); NOTES['set:order'] = { order: keys, t: Date.now() }; saveNotes('set:order'); rerender(focus ? to : null); };
 const list = $('#setl');
 let drag = null;
 list.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  e.preventDefault(); g.setPointerCapture(e.pointerId);
  const rows = [...list.children], li = g.closest('li');
  drag = { li, y0: e.clientY, idx: rows.indexOf(li), rows, mids: rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2; }), h: li.getBoundingClientRect().height, to: rows.indexOf(li) };
  li.classList.add('drag');
 });
 list.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0, mid = drag.mids[drag.idx] + dy;
  drag.li.style.transform = `translateY(${dy}px)`;
  const to = drag.mids.filter((m, i) => i !== drag.idx && m < mid).length; drag.to = to;
  drag.rows.forEach((r, i) => { if (r === drag.li) return; let s = 0; if (drag.idx < to && i > drag.idx && i <= to) s = -drag.h; if (drag.idx > to && i >= to && i < drag.idx) s = drag.h; r.style.transform = s ? `translateY(${s}px)` : ''; });
 });
 const end = () => { if (!drag) return; const { idx, to, rows, li } = drag; drag = null; rows.forEach(r => { r.style.transform = ''; }); li.classList.remove('drag'); if (to !== idx) moveSet(idx, to); };
 list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
 list.addEventListener('keydown', e => { const g = e.target.closest('.grip'); if (!g) return; const i = [...list.children].indexOf(g.closest('li')); if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); moveSet(i, i - 1, true); } if (e.key === 'ArrowDown' && i < list.children.length - 1) { e.preventDefault(); moveSet(i, i + 1, true); } });
 list.addEventListener('click', e => {
  const x = e.target.closest('.ss-x'); if (x) { toggleSet(x.dataset.k); rerender(); return; }
  const d = e.target.closest('.ss-dur'); if (!d) return;
  const k = d.dataset.k, it = chosen.find(c => c.k === k); if (!it) return;
  const cell = d.parentNode, cur = it.n.dm > 0 ? fmtClock(it.n.dm) : '';
  cell.innerHTML = `<input class="ss-din" inputmode="text" autocomplete="off" placeholder="${esc(autoDur(it.t, it.n) || 'm:ss')}" value="${esc(cur || autoDur(it.t, it.n))}" aria-label="Durée de ${esc(it.t.n)}, en minutes:secondes. Vide pour revenir à la durée trouvée automatiquement.">`;
  const inp = cell.firstChild; inp.focus(); inp.select();
  let done = false;
  const finish = save => {
   if (done) return; done = true;
   if (save) {
    const v = inp.value.trim(), auto = autoDur(it.t, it.n);
    const sec = v === auto && !(it.n.dm > 0) ? 0 : parseDur(v);
    if (sec === null) { flash('Durée non comprise : écris-la comme 4:05.', 4000); }
    else if (sec !== (it.n.dm || 0)) setNote(k, { dm: sec });
   }
   rerender();
  };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); finish(true); } else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); } });
  inp.addEventListener('blur', () => finish(true));
 });
 $('#copy').onclick = async () => { const txt = `Sound system — ${chosen.length} titres${secs ? ' · ' + fmtDur(secs) : ''}\n` + chosen.map((x, i) => `${i + 1}. ${x.n.b || '—'} BPM · ${x.t.n} — ${x.t.a || x.r.a} (${x.r.t}, ${x.t.p})${durOf(x.t, x.n) ? ' · ' + durOf(x.t, x.n) : ''}${x.n.c ? ' · ' + x.n.c : ''}`).join('\n') + `\n\nDisques à sortir : ` + [...discs.values()].map(d => `${d.r.t} (${d.p.join(', ')})`).join(' · '); try { await navigator.clipboard.writeText(txt); flash('Liste copiée'); } catch (e) { flash('Copie refusée par le navigateur'); } };
 const cl = $('#clear');
 cl.onclick = () => { if (!cl.dataset.ok) { cl.dataset.ok = 1; cl.textContent = 'Confirmer'; return; } chosen.forEach(x => { NOTES[x.k] = Object.assign({}, x.n, { set: false, t: Date.now() }); }); NOTES['set:order'] = { order: [], t: Date.now() }; saveNotes([...chosen.map(x => x.k), 'set:order']); vSound(); };
}

function frErr(e){
 const m = String((e && e.message) || e || '');
 if (/Invalid login credentials/i.test(m)) return 'Email ou mot de passe incorrect.';
 if (/Email not confirmed/i.test(m)) return 'Confirme d’abord ton email : le lien t’attend dans ta boîte de réception.';
 if (/already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet email. Connecte-toi.';
 if (/Password should|weak|at least/i.test(m)) return 'Mot de passe trop faible : 8 caractères minimum.';
 if (/rate limit|security purposes|too many/i.test(m)) return 'Trop de tentatives. Réessaie dans une minute.';
 if (/invalid.*email|validate email|email address/i.test(m)) return 'Cette adresse email n’est pas valide.';
 if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Connexion impossible. Vérifie ton réseau.';

}

  if (error) $('#er').textContent = frErr(error); else $('#ok').textContent = 'Si un compte existe pour cette adresse, un lien t’attend dans ta boîte mail.';
 };
}

function vNewPass(){
 if (!session) { V.innerHTML = `${obHead('#connexion')}<h1>Lien <i class="s">expiré</i></h1><p class="mut" style="margin:10px 0 0">Ce lien n’est plus valable. Demande-en un nouveau.</p><div class="obb"><a class="btn" href="#mdp-oublie">Recevoir un nouveau lien</a></div>`; return; }
 V.innerHTML = `${obHead('')}
 <h1>Nouveau <i class="s">mot de passe</i></h1>
 <form id="f" novalidate>${pwField('pw', 'Nouveau mot de passe, 8 caractères minimum', 'new-password')}
 <p class="err" id="er" role="alert"></p><button class="btn" id="go" style="width:100%;margin-top:18px">Enregistrer</button></form>`;
 pwToggles();
 $('#f').onsubmit = async e => {

 };

/* ---------- Étapes d’arrivée ---------- */
function progress(n, total){ const pct = total ? Math.round(n / total * 100) : 0; return `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><p class="small mut" style="margin:8px 0 0">${n}${total ? ' / ' + total : ''} disques importés…</p>`; }
function vObDiscogs(){
 const relink = !!(profile && profile.onboarded);
 V.innerHTML = `${relink ? obHead('#profil') : stepHead(1)}
 <h1 style="margin-top:22px">Relie ta <i class="s">collection</i></h1>
 <p class="mut" style="margin:12px 0 0">Discollection lit ta collection Discogs pour ranger tes disques en bacs. Il lui faut un jeton personnel, ça prend une minute :</p>
 <ol class="howto"><li>Ouvre <a href="https://www.discogs.com/settings/developers">Discogs › Paramètres › Développeurs</a></li><li>Touche « Générer un nouveau jeton »</li><li>Copie-le et colle-le ci-dessous</li></ol>
 <form id="f" novalidate><label class="field"><span>Jeton personnel Discogs</span><input class="in" id="tk" autocomplete="off" autocapitalize="off" spellcheck="false" required value="${esc(S.token)}"></label>
 <p class="err" id="er" role="alert"></p><div id="pg"></div>
 <button class="btn" id="go" style="width:100%;margin-top:18px">${S.token && !relink ? 'Continuer avec ce jeton' : 'Relier ma collection'}</button></form>
 <p class="note" style="margin-top:14px">Le jeton est rangé dans ton compte, visible de toi seul. Tu peux le révoquer à tout moment sur Discogs.</p>
 ${relink ? '' : '<button class="linkb" id="skip">Passer cette étape</button>'}`;
 const sk = $('#skip'); if (sk) sk.onclick = async () => { location.hash = 'etape-rangement'; };
 $('#f').onsubmit = async e => {
  e.preventDefault(); const tk = $('#tk').value.trim(), go = $('#go'), er = $('#er'); er.textContent = '';
  if (tk.length < 20) { er.textContent = 'Ce jeton semble incomplet : colle-le en entier.'; return; }
  busy(go, true, 'Vérification du jeton…');
  try {
   const who = await discogsIdentity(tk);
   S.token = tk; S.user = who.username;
   go.textContent = 'Import de ta collection…';
   const lib = await importDiscogs((n, t) => { $('#pg').innerHTML = progress(n, t); });
   mergeLib(lib); saveLib();
   await saveProfile({ discogs_user: S.user, discogs_token: S.token });
   flash(`${LIB.length} disques importés`);
   location.hash = relink ? 'profil' : 'etape-rangement';
  } catch (err) { er.textContent = err.message === 'Failed to fetch' ? 'Discogs ne répond pas. Vérifie ta connexion et réessaie.' : err.message; busy(go, false); }
 };
}
function vObRangement(){
 V.innerHTML = `${stepHead(2)}
 <h1 style="margin-top:22px">Range tes <i class="s">bacs</i></h1>
 <p class="mut" style="margin:12px 0 0">Comme chez le disquaire : choisis comment tes disques sont répartis. Tu pourras changer d’avis dans ton profil.</p>
 <div class="pills" role="radiogroup" aria-label="Rangement" id="rg" style="margin-top:20px"></div>
 <ul class="list" id="pv" style="margin-top:20px"></ul>
 <p class="note" style="margin-top:18px">Le BPM de tes titres se remplira tout seul quand tu ouvriras tes disques.</p>
 <button class="btn" id="go" style="width:100%;margin-top:20px">Ouvrir mes bacs</button>
 <p class="credit" style="text-align:center;margin-top:16px">Tempo et tonalité fournis par <a href="https://getsongbpm.com">GetSongBPM.com</a></p>`;
 const draw = () => {
  $('#rg').innerHTML = RANG.map(([id, l]) => `<button class="pill" role="radio" aria-checked="${id === S.rangement}" data-r="${id}">${l}</button>`).join('');
  const B = bins();
  $('#pv').innerHTML = LIB.length ? B.slice(0, 5).map(b => `<li style="display:flex;align-items:center;gap:12px;min-height:56px"><span style="display:flex">${b.rs.slice(0, 3).map((r, j) => cover(r, 32, `margin-left:${j ? -10 : 0}px;box-shadow:0 0 0 2px #0a0a0a`)).join('')}</span><span class="ell" style="flex:1;font:400 22px var(--serif)">${esc(b.g)}</span><span class="small dim">${b.rs.length}</span></li>`).join('') + (B.length > 5 ? `<li class="small dim" style="padding:12px 0">et ${B.length - 5} autres bacs</li>` : '')
   : '<li class="note" style="padding:14px 0">Tes bacs se rempliront quand ta collection sera reliée.</li>';
 };
 draw();
 $('#rg').onclick = e => { const b = e.target.closest('button'); if (b) { S.rangement = b.dataset.r; draw(); } };
 $('#go').onclick = async () => { const go = $('#go'); busy(go, true); try { await saveProfile({ rangement: S.rangement, onboarded: true }); setMode(); location.hash = 'bacs'; flash('Bienvenue' + (profile.pseudo ? ', ' + profile.pseudo : '')); } catch (err) { flash(err.message); busy(go, false); } };
}
function vProfil(){
 const tr = allTracks();
 const stats = `<dl class="stats">${[[LIB.length,'disques'],[tr.filter(x => x.n.s).length,'titres notés'],[tr.filter(x => x.n.b).length,'BPM connus'],[tr.filter(x => x.n.c).length,'commentaires']].map(([v, l]) => `<div style="display:flex;flex-direction:column-reverse;justify-content:flex-end"><dt class="small mut">${l}</dt><dd style="margin:0;font:400 clamp(28px,5vw,36px)/1 var(--serif)">${v}</dd></div>`).join('')}</dl>`;
 const rangPills = `<div class="pills" role="radiogroup" aria-label="Rangement des bacs" id="rg">${RANG.map(([id, l]) => `<button class="pill" role="radio" aria-checked="${id === S.rangement}" data-r="${id}">${l}</button>`).join('')}</div>`;
 const sources = `<div style="margin-top:22px;padding:16px;border-radius:14px;border:1px solid var(--line)"><p class="lab">Sources</p><p style="margin:6px 0 0">Tempo et tonalité fournis par <a href="https://getsongbpm.com" style="font-weight:500;text-underline-offset:3px">GetSongBPM.com</a></p><p class="small dim" style="margin:4px 0 0">Tempo aussi via <a href="https://www.deezer.com">Deezer</a>. Collection et pochettes via Discogs. Reconnaissance des titres via AudD.</p></div>`;
 const backup = `<h2 class="sec">Sauvegarde</h2><p class="small mut" style="margin:8px 0 0">${session ? 'Tes notes sont synchronisées avec ton compte.' : dbDoc ? 'Tes notes sont enregistrées dans ton espace privé de cette page.' : 'Tes notes sont enregistrées dans ce navigateur.'} Tu peux aussi les copier pour les garder ailleurs.</p>
 <div class="pills" style="margin-top:14px"><button class="btn2" id="exp">Copier mes notes</button><button class="btn2" id="impB">Coller des notes</button><button class="btn2" id="wipe">Effacer mes notes</button></div><div id="impZ"></div>`;
 if (!session) {
  V.innerHTML = `<div style="max-width:720px"><h1>Profil</h1>
  <p class="mut" style="margin:10px 0 0">Tu explores la collection de démonstration.${sb ? ' Crée ton compte pour relier ta vraie collection Discogs et retrouver tes notes sur tous tes appareils.' : ''}</p>
  ${sb ? '<div class="pills" style="margin-top:20px"><a class="btn" href="#inscription">Créer mon compte</a><a class="btn2" href="#connexion">Se connecter</a></div>' : ''}
  ${stats}<h2 class="sec">Mes bacs</h2><p class="small mut" style="margin:8px 0 14px">Comment tes disques sont répartis.</p>${rangPills}
  ${sources}${backup}
  ${LIMITED ? '' : '<button class="linkb" id="quit" style="margin-left:0">Quitter la démo</button>'}</div>`;
 } else {
  const p = profile || {};
  V.innerHTML = `<div style="max-width:720px">
  <div style="display:flex;align-items:center;gap:16px"><div class="avatar" aria-hidden="true">${esc((p.pseudo || session.user.email || '?')[0].toUpperCase())}</div><div style="min-width:0"><h1 class="ell" style="font-size:clamp(34px,5vw,46px)">${esc(p.pseudo || 'Profil')}</h1><p class="small mut ell" style="margin:4px 0 0">${esc(session.user.email || '')}</p></div></div>
  ${stats}
  <h2 class="sec">Mes bacs</h2><p class="small mut" style="margin:8px 0 14px">Comment tes disques sont répartis.</p>${rangPills}
  <h2 class="sec">Discogs</h2>
  ${S.user ? `<p class="small mut" style="margin:8px 0 0">Relié à <b style="color:var(--ink);font-weight:500">${esc(S.user)}</b> · ${LIB.length} disques.</p>
   <div class="pills" style="margin-top:14px"><button class="btn2" id="sync">Resynchroniser</button><a class="btn2" href="#etape-discogs">Changer de jeton</a><button class="btn2" id="unl">Délier</button></div><div id="pg"></div>`
   : `<p class="small mut" style="margin:8px 0 0">Ta collection n’est pas encore reliée.</p><div class="pills" style="margin-top:14px"><a class="btn" href="#etape-discogs">Relier ma collection</a></div>`}
  <h2 class="sec">Tempo et reconnaissance</h2>
  <p class="small mut" style="margin:8px 0 0">Le BPM et la tonalité de tes titres sont cherchés automatiquement sur GetSongBPM, puis sur Deezer. Pour un titre introuvable, mesure-le au micro, sur un enregistrement ou en tapant le tempo.</p>
  <label class="field"><span>Jeton AudD, pour reconnaître le titre qui tourne (facultatif)</span><input class="in" id="ak" type="password" autocomplete="off" value="${esc(S.audd)}" placeholder="Obtenu sur audd.io"></label>
  <p class="small mut" style="margin:10px 0 0">Micro : ${CAN_MIC ? 'disponible. Il ne s’active que quand tu touches « Mesurer au micro » ou « Reconnaître ».' : 'indisponible dans ce navigateur.'}</p>
  ${sources}
  <h2 class="sec">Compte</h2>
  <label class="field"><span>Prénom ou pseudo</span><input class="in" id="ps" maxlength="40" value="${esc(p.pseudo || '')}"></label>
  <form id="pwf" novalidate>${pwField('npw', 'Nouveau mot de passe', 'new-password')}<button class="btn2" style="margin-top:10px">Changer le mot de passe</button></form>
  ${backup}
  <button class="btn2" id="out" style="width:100%;min-height:52px;margin-top:40px">Se déconnecter</button>
  <p class="note" style="margin-top:10px;text-align:center">Tes notes restent dans ton compte. Elles sont retirées de cet appareil.</p>
  </div>`;
 }
 $('#rg').onclick = async e => { const b = e.target.closest('button'); if (!b) return; S.rangement = b.dataset.r; if (session) saveProfile({ rangement: S.rangement }).catch(err => flash(err.message)); else ls.set('demoRang', S.rangement); vProfil(); flash('Bacs rangés ' + RANG.find(x => x[0] === S.rangement)[1].toLowerCase()); };
 const q = $('#quit'); if (q) q.onclick = () => { leaveDemo(); setMode(); location.hash = 'bienvenue'; };
 const field = (id, col, k) => { const el = $('#' + id); if (el) el.onchange = () => { S[k] = el.value.trim(); saveProfile({ [col]: S[k] }).then(() => flash('Enregistré')).catch(err => flash(err.message)); }; };
 field('ak', 'audd_token', 'audd');
 const ps = $('#ps'); if (ps) ps.onchange = () => saveProfile({ pseudo: ps.value.trim() }).then(() => { flash('Enregistré'); vProfil(); }).catch(err => flash(err.message));
 const pwf = $('#pwf'); if (pwf) { pwToggles(); pwf.onsubmit = async e => { e.preventDefault(); const pw = $('#npw').value; if (pw.length < 8) return flash('8 caractères minimum'); const { error } = await sb.auth.updateUser({ password: pw }); flash(error ? frErr(error) : 'Mot de passe changé'); if (!error) $('#npw').value = ''; }; }
 const sy = $('#sync'); if (sy) sy.onclick = async () => { busy(sy, true, 'Synchronisation…'); try { const lib = await importDiscogs((n, t) => { $('#pg').innerHTML = progress(n, t); }); mergeLib(lib); saveLib(); flash(`${LIB.length} disques à jour`); vProfil(); } catch (err) { flash(err.message); busy(sy, false); } };
 const un = $('#unl'); if (un) un.onclick = async () => { if (!un.dataset.ok) { un.dataset.ok = 1; un.textContent = 'Confirmer'; return; } try { await saveProfile({ discogs_user: null, discogs_token: null }); S.user = ''; S.token = ''; LIB = []; saveLib(); flash('Discogs délié'); vProfil(); } catch (err) { flash(err.message); } };
 const out = $('#out'); if (out) out.onclick = () => { busy(out, true, 'Déconnexion…'); logout(); };
 $('#exp').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify({ discollection: 1, notes: NOTES })); flash('Notes copiées'); } catch (e) { flash('Copie refusée par le navigateur'); } };
 $('#impB').onclick = () => {
  $('#impZ').innerHTML = `<label class="field"><span>Colle ici des notes copiées depuis Discollection</span><textarea class="in" id="impT"></textarea></label><button class="btn" id="impG" style="margin-top:10px">Importer</button>`;
  $('#impG').onclick = () => { try { const j = JSON.parse($('#impT').value); if (!j || typeof j.notes !== 'object') throw 0; const ks = []; for (const [k, v] of Object.entries(j.notes)) if (v && typeof v === 'object' && (!NOTES[k] || (v.t || 0) >= (NOTES[k].t || 0))) { NOTES[k] = v; ks.push(k); } saveNotes(ks); flash(ks.length + ' notes importées'); vProfil(); } catch (e) { flash('Texte non reconnu'); } };
 };
 const w = $('#wipe'); w.onclick = async () => { if (!w.dataset.ok) { w.dataset.ok = 1; w.textContent = 'Confirmer l’effacement'; return; } if (session) { const { error } = await sb.from('notes').delete().eq('user_id', uid()); if (error) return flash('Effacement impossible'); } NOTES = {}; saveNotes(); flash('Notes effacées'); vProfil(); };
}

async function recognizeFlow(){
 V.innerHTML = `<div style="max-width:560px;margin:0 auto;text-align:center"><a class="btn2" href="#bacs">Annuler</a><div class="listen" aria-hidden="true"><i></i><i></i><i></i><b id="cd">12</b></div><h1>J’écoute <i class="s">la platine…</i></h1><p class="mut" id="rst">Approche ton téléphone de l’enceinte. Environ 12 s de son sont envoyées à AudD pour reconnaître le titre.</p></div>`;
 try {
  const blob = await recordMic(12, s => { const c = $('#cd'); if (c) c.textContent = s; });
  $('#rst').textContent = 'Reconnaissance et calcul du tempo…';
  const [rec, tempo] = await Promise.all([auddRecognize(blob), analyze(await blob.arrayBuffer()).catch(() => null)]);
  const hit = await matchInLib(rec);
  if (!hit) { $('#rst').textContent = `C’est « ${rec.title} » de ${rec.artist}, mais ce titre n’est pas dans ta collection.`; return; }
  const k = key(hit.r.id, hit.i);
  if (tempo && !note(k).b) setNote(k, { b: tempo.b, src: 'Mesuré au micro' });
  location.hash = `titre-${hit.r.id}-${hit.i}`;
 } catch (e) { const r = $('#rst'); if (r) r.textContent = e.name === 'NotAllowedError' ? 'Accès au micro refusé.' : (e.message === 'Failed to fetch' ? 'AudD injoignable depuis cette adresse.' : e.message); }
}

/* ---------- Routeur ---------- */
function setMode(){ const t = $('#modeTag'); t.innerHTML = !session && DEMO_ON && sb ? '<a href="#inscription">Démo · Créer un compte</a>' : !session && DEMO_ON ? 'Démo' : ''; }
function route(){
 let h = location.hash.slice(1); let m;
 if (/access_token=|error_description=|type=recovery/.test(h)) return;
 if (session && !profile) { document.body.classList.add('ob'); window.scrollTo(0, 0); vAcctErr(); return; }
 const authed = !!session, onboarded = !!(authed && profile && profile.onboarded);
 if (!authed) { if (!DEMO_ON && !OB.includes(h)) h = 'bienvenue'; if (STEPS.includes(h)) h = DEMO_ON ? 'bacs' : 'bienvenue'; }
 else if (!onboarded) { if (!STEPS.includes(h) && h !== 'nouveau-mdp') h = 'etape-discogs'; }
 else if (OB.includes(h) && h !== 'nouveau-mdp') h = 'bacs';
 if (!h) h = 'bacs';
 if (h !== location.hash.slice(1)) history.replaceState(null, '', '#' + h);
 const flow = OB.includes(h) || STEPS.includes(h);
 document.body.classList.toggle('ob', flow);
 const tab = h.startsWith('systeme') ? 'systeme' : h === 'notes' ? 'notes' : h.startsWith('profil') ? 'profil' : 'bacs';
 document.querySelectorAll('[data-tab]').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
 window.scrollTo(0, 0); bacGo = null; if (curveObs) { curveObs.disconnect(); curveObs = null; }
 if (h === 'bienvenue') vWelcome();
 else if (h === 'inscription') sb ? vSignup() : vWelcome();
 else if (h === 'connexion') sb ? vLogin() : vWelcome();
 else if (h === 'verifie') vVerify();
 else if (h === 'mdp-oublie') sb ? vForgot() : vWelcome();
 else if (h === 'nouveau-mdp') vNewPass();
 else if (h === 'etape-discogs') vObDiscogs();
 else if (h === 'etape-rangement') vObRangement();
 else if (h === 'systeme') vSound();
 else if (h === 'notes') vNotes();
 else if (h === 'profil') vProfil();
 else if (m = h.match(/^bac-([a-z0-9-]+)$/)) vBac(m[1]);
 else if (m = h.match(/^disque-([a-z0-9]+)$/i)) vDisque(m[1]);
 else if (m = h.match(/^titre-([a-z0-9]+)-(\d+)$/i)) { const r = byId(m[1]); if (r && !r.tr) loadTracks(r).then(() => vTitre(m[1], +m[2])).catch(() => vDisque(m[1])); else vTitre(m[1], +m[2]); }
 else vBacs();
}
addEventListener('hashchange', route);

async function boot(){
 if (sb) {
  const h0 = location.hash;
  sb.auth.onAuthStateChange((ev, s) => {
   session = s;
   if (ev === 'PASSWORD_RECOVERY') setTimeout(() => { location.hash = 'nouveau-mdp'; }, 0);
   if (ev === 'SIGNED_OUT' && profile) { profile = null; }
  });
  try { const { data } = await sb.auth.getSession(); session = data.session; } catch (e) { session = null; }
  if (/error_description=/.test(h0)) { bootMsg = decodeURIComponent(((h0.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' ')); if (/expired|invalid/i.test(bootMsg)) bootMsg = 'Ce lien a expiré. Connecte-toi ou demande-en un nouveau.'; history.replaceState(null, '', location.pathname + '#bienvenue'); }
  else if (/access_token=/.test(h0)) history.replaceState(null, '', location.pathname + (/type=recovery/.test(h0) ? '#nouveau-mdp' : '#'));
  if (session) { try { await loadAccount(); } catch (e) { acctErr = acctMsg(e); profile = null; } }
 }
 if (!session && DEMO_ON) enterDemo();
 setMode(); route();
 if (session && profile && profile.onboarded) bgImport();
}
boot();

/* ---------- Espace privé claude.ai ---------- */
(async () => {
 if (!window.claude || typeof window.claude.use !== 'function' || session) return;
 try {
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const ref = db.collection('data/users/' + uid).doc('discollection');
  const snap = await ref.get();
  if (snap.exists) {
   const remote = (snap.data() || {}).notes || {};
   for (const [k, v] of Object.entries(remote)) if (v && (!NOTES[k] || (v.t || 0) > (NOTES[k].t || 0))) NOTES[k] = v;
   ls.set('notes', NOTES);
  }
  dbDoc = ref;
  if (!snap.exists) saveNotes();
  const h = location.hash.slice(1);
  if (!/^titre-/.test(h)) route();
 } catch (e) {}
})();
}
