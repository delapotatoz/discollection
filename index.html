<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discollection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calme et nocturne, une pochette éclairée dans une pièce sombre
   IDEA: le bac du disquaire, et la fiche qu'on glisse dans chaque pochette
   PICTURE: le bac de pochettes empilées, celle qu'on sort levée au-dessus des autres
   COLOUR and TYPE: noir #0a0a0a, crème #efe6d2, gris chauds ; Instrument Serif + Inter 300 ; les pochettes seules en couleur
   LAYOUT: barre latérale au-dessus de 900px, onglets en bas sur téléphone, colonne de 1100px */
:root{color-scheme:dark;--bg:#0a0a0a;--ink:#efe6d2;--mut:#a89f8e;--dim:#8a8274;--line:#2a2826;--soft:#1d1c1a;--card:#111110;--serif:'Instrument Serif',Georgia,serif}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;padding:20px max(4vw,18px) 120px;max-width:1140px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(4vw,18px) 0}
.brand{font-family:var(--serif);font-size:26px;text-decoration:none;letter-spacing:-.01em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:8px 8px calc(14px + env(safe-area-inset-bottom));background:rgba(10,10,10,.96);border-top:1px solid var(--soft)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;min-height:48px;justify-content:center;text-decoration:none;color:var(--dim);font-size:12px}
.tab[aria-current=page]{color:var(--ink);font-weight:500}
.tab svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
@media(min-width:900px){
 .top,.tabs{display:none}
 .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;padding:30px 22px;border-right:1px solid var(--soft);position:sticky;top:0;height:100vh}
 .side .brand{margin-bottom:26px}
 .nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:999px;text-decoration:none;color:var(--dim)}
 .nav[aria-current=page]{color:var(--ink);background:var(--card)}
 .side .credit{margin-top:auto}
 main{padding:40px 48px 80px}
}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,6vw,56px);letter-spacing:-.02em}
h2{font-size:clamp(28px,3.4vw,34px)}
i.s{font-style:italic}
.lab{font-size:13px;color:var(--mut);margin:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#0a0a0a;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid #3a3733;background:transparent;font-size:14px;text-decoration:none;white-space:nowrap}
.btn2[disabled],.btn[disabled]{opacity:.4;cursor:not-allowed}
.ico{width:46px;height:46px;border-radius:50%;border:1px solid #3a3733;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico.on{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.pill[aria-pressed=true],.pill[aria-checked=true]{background:var(--ink);color:#0a0a0a;border-color:var(--ink);font-weight:500}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--soft)}
.rowl{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0;text-decoration:none}
.cv{position:relative;overflow:hidden;border-radius:2px;background:#1a1918;flex:none}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid2{display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.sec{margin-top:44px}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.in{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
textarea.in{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.55}
.in:focus{border-color:#5a554d}
.stars{display:flex;margin-left:-8px}
.stars button{width:46px;height:46px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.stars svg{width:26px;height:26px;stroke:var(--ink);stroke-width:1.3}
.bpm{font-family:var(--serif);font-size:clamp(64px,12vw,96px);line-height:.85}
.panel{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-top:22px}
.stage{position:relative;width:100%;max-width:480px;margin:0 auto;padding:84px 0 8px;outline:none}
.amb{position:absolute;left:4%;right:4%;top:22%;bottom:-6%;filter:blur(70px) saturate(1.4);opacity:.45;pointer-events:none;overflow:hidden;border-radius:50%}
.amb>*{width:100%;height:100%;object-fit:cover;display:block}
.stack{position:relative;width:76%;aspect-ratio:1;margin-left:4%}
.sl{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:#1a1918;display:block}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.back{transform:translateY(calc(var(--j) * -19px)) scale(calc(1 - var(--j) * .05));transform-origin:50% 0;filter:brightness(calc(.6 - var(--j) * .1));z-index:calc(10 - var(--j));box-shadow:0 -4px 14px rgba(0,0,0,.6)}
.disc{position:absolute;top:3%;bottom:3%;aspect-ratio:1;right:-25%;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0c 0 1px,#1b1a19 1px 3px);box-shadow:0 0 0 1px #2a2826,0 20px 40px rgba(0,0,0,.6);z-index:11;animation:discOut .7s cubic-bezier(.2,.8,.2,1)}
.disc::after{content:'';position:absolute;inset:2%;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 14%,rgba(239,230,210,.10) 20%,transparent 27% 63%,rgba(239,230,210,.07) 70%,transparent 77%);box-shadow:inset 0 0 0 1px rgba(239,230,210,.08)}
.disc span{position:absolute;inset:34%;border-radius:50%;overflow:hidden;background:#1a1918}
.disc span img{width:100%;height:100%;object-fit:cover}
.disc i{position:absolute;inset:48.5%;border-radius:50%;background:#0a0a0a;z-index:1}
.front2{z-index:12;box-shadow:0 40px 80px rgba(0,0,0,.8),0 0 0 1px rgba(239,230,210,.06);transition:transform .25s ease}
.front2:hover{transform:translateY(-6px)}
.front2.next{animation:fromBack .45s cubic-bezier(.2,.8,.2,1)}
.front2.prev{animation:fromFront .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fromBack{from{transform:translateY(-22px) scale(.95);filter:brightness(.6)}to{transform:none;filter:none}}
@keyframes fromFront{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes discOut{from{transform:translateX(-32%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#0a0a0a;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(min-width:900px){.toast{bottom:32px}}
.listen{position:relative;width:200px;height:200px;margin:20px auto}
.listen i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--ink);animation:ring 2.4s ease-out infinite}
.listen i:nth-child(2){animation-delay:.8s}.listen i:nth-child(3){animation-delay:1.6s}
.listen b{position:absolute;inset:64px;border-radius:50%;background:var(--ink);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font:400 28px var(--serif)}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.tapbox{width:100%;min-height:120px;border-radius:16px;border:1px dashed #5a554d;background:var(--card);font-size:15px}
.tapbox:active{background:#1a1918}
.credit{font-size:12px;color:var(--dim);line-height:1.5}
.credit a{color:var(--mut)}
.note{font-size:13px;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ico[disabled]{opacity:.3;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="Navigation">
<a class="brand" href="#bacs">Discollection</a>
<a class="nav" data-tab="bacs" href="#bacs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M7 8V4h10v4"/></svg>Bacs</a>
<a class="nav" data-tab="systeme" href="#systeme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="7" height="18" rx="1"/><rect x="13" y="3" width="7" height="18" rx="1"/><circle cx="7.5" cy="15" r="2"/><circle cx="16.5" cy="15" r="2"/></svg>Système</a>
<a class="nav" data-tab="profil" href="#profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</a>
<p class="credit">Tempo et tonalité fournis par <a href="https://getsongbpm.com">GetSongBPM.com</a>. Collection via Discogs.</p>
</aside>
<div style="flex:1;min-width:0">
<div class="top"><a class="brand" href="#bacs">Discollection</a><span id="modeTag" class="note"></span></div>
<main id="view" aria-live="polite"></main>
</div>
</div>
<nav class="tabs" aria-label="Principal">
<a class="tab" data-tab="bacs" href="#bacs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="1"/><path d="M7 8V4h10v4"/></svg>Bacs</a>
<a class="tab" data-tab="systeme" href="#systeme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="7" height="18" rx="1"/><rect x="13" y="3" width="7" height="18" rx="1"/><circle cx="7.5" cy="15" r="2"/><circle cx="16.5" cy="15" r="2"/></svg>Système</a>
<a class="tab" data-tab="profil" href="#profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profil</a>
</nav>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $ = s => document.querySelector(s);
const V = $('#view');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const framed = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
const LIMITED = framed || !!window.claude;
const CAN_NET = !LIMITED && /^https?:$/.test(location.protocol);
const CAN_MIC = CAN_NET && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!window.MediaRecorder;
const MOMENTS = ['Ouverture','Montée','Pic','Rewind','Fin de soirée'];

/* ---------- Démo ---------- */
const C = {
 rings:'repeating-radial-gradient(circle,#e63946 0 6px,#120c09 6px 14px)',
 lagos:'repeating-linear-gradient(45deg,#06d6a0 0 18px,#073b4c 18px 36px)',
 highlife:'repeating-linear-gradient(90deg,#fcbf49 0 24px,#d62828 24px 48px,#003049 48px 72px)',
 fire:'radial-gradient(circle,#ffba08 0 20%,#e85d04 20% 40%,#9d0208 40% 60%,#370617 60%)',
 mud:'radial-gradient(circle at 70% 30%,#f1faee 0 12%,transparent 12.5%),linear-gradient(#2b2118 0 70%,#6b4f3a 70%)',
 bloom:'radial-gradient(circle at 50% 110%,#f4a261 0 45%,#e76f51 45% 60%,#fefae0 60%)',
 orbit:'radial-gradient(circle at 66% 34%,#ffd166 0 18%,transparent 18.5%),linear-gradient(#0b132b 0 60%,#ef476f 60%)',
 desert:'linear-gradient(#f6bd60 0 50%,#f28482 50% 56%,#84a59d 56%)',
 nuit:'linear-gradient(90deg,#0d1b2a 0 62%,#415a77 62% 70%,#e0e1dd 70% 74%,#0d1b2a 74%)',
 neon:'linear-gradient(180deg,#ff5fa2 0 33%,#7b2ff7 33% 66%,#00d1ff 66%)',
 spectral:'conic-gradient(#ff006e 0 25%,#ffbe0b 0 50%,#3a86ff 0 75%,#8338ec 0)',
 synth:'repeating-linear-gradient(0deg,#00f5d4 0 2px,#10002b 2px 12px)',
 sun:'radial-gradient(circle at 50% 40%,#ffd166 0 22%,transparent 22.5%),repeating-linear-gradient(0deg,#e76f51 0 10px,#264653 10px 20px)',
 moss:'linear-gradient(135deg,#2a9d8f 0 50%,#e9c46a 50% 54%,#1d3557 54%)'
};
const T = s => s.split(';').map(x => { const [p,n,d] = x.split('|'); return {p,n,d:d||''}; });
const DEMO = [
 ['d1','Kaya Dread','Rivers of Echo',1978,'Sufferah Sound · SS-0412','Dub & Roots','rings','A1|Rivers of Echo|4:12;A2|Babylon Static|3:48;A3|Version Galore|5:01;B1|Sufferah’s Reverb|4:33;B2|Melodica Sunrise|3:56;B3|Dub Plate Special|6:10'],
 ['d2','Ital Brothers','Jah Signal',1976,'Zion Gate · ZG-118','Dub & Roots','lagos','A1|Jah Signal|4:02;A2|Zion Train Coming|3:40;B1|Jah Signal Dub|4:20;B2|Roots Man|3:55'],
 ['d3','Nyah Fisher','Kingston Haze',1979,'Tenement · TN-07','Dub & Roots','highlife','A1|Kingston Haze|3:58;A2|Ghetto Lullaby|4:11;B1|Haze Version|4:05;B2|Tenement Yard|3:30'],
 ['d4','Rockers Unit','Sound Clash 77',1977,'Clash Records · CR-77','Dub & Roots','fire','A1|Sound Clash|3:44;A2|Dubwise Shower|4:28;B1|Rockers Delight|3:51;B2|Clash Version|4:40'],
 ['d5','Selassie Hi-Fi','Rebel Frequency',1981,'Hi-Fi Lion · HF-3','Dub & Roots','mud','A1|Rebel Frequency|4:15;A2|Firehouse|3:37;B1|Frequency Dub|4:50;B2|Natty Step|3:22'],
 ['d6','Zion Rays','Steppers Delight',1983,'Rays · R-21','Dub & Roots','desert','A1|Steppers Delight|5:10;A2|Rays of Light|4:02;B1|Steppers Version|5:30'],
 ['d7','The Dubwise Crew','Night Version',1980,'Dubwise · DW-9','Dub & Roots','orbit','A1|Midnight Rockers|4:20;A2|Echo Chamber|3:58;B1|Night Version|5:12;B2|Last Bus Dub|4:44'],
 ['d8','Lion Dub','Echo Valley',1982,'Valley · V-002','Dub & Roots','bloom','A1|Echo Valley|4:30;A2|Lion Heart|3:50;B1|Valley Dub|5:05'],
 ['d9','J.-B. Morel Trio','Nuit Bleue',1958,'Disques Mistral · MS 30.112','Jazz','nuit','A1|Nuit Bleue|6:42;A2|Rue des Martyrs|4:15;B1|Le Caveau, 3 h|7:20;B2|Aube sur la Seine|5:31'],
 ['d10','Les Lunes Électriques','Orbite Basse',1974,'Disques Satellite · DS-40','Jazz','sun','A1|Orbite Basse|5:44;A2|Apesanteur|4:30;B1|Retour sur Terre|6:02'],
 ['d11','Sister Ruby','Fire Sermon',1972,'Revival Records · RV-2201','Soul & Gospel','fire','A1|Wake the Valley|3:52;A2|Fire Sermon|4:40;A3|Hallelujah Bus|3:18;B1|Testify|4:55'],
 ['d12','The Velvet Hours','Slow Bloom',1969,'Velvet · VH-12','Soul & Gospel','bloom','A1|Slow Bloom|3:20;A2|Honey Rain|2:58;B1|Late Again|3:41'],
 ['d13','Kofi Mensah','Highlife Radio',1971,'Accra Sound · AS-5','Afro','highlife','A1|Highlife Radio|5:20;A2|Palm Wine|4:48;B1|Kumasi Groove|6:01'],
 ['d14','Marla Okoye','Lagos Night Shift',1976,'Afrodisc · AD-31','Afro','lagos','A1|Lagos Night Shift|6:30;A2|Night Bus to Ikeja|5:12;B1|Overtime|7:04'],
 ['d15','Prism Collective','Spectral',1994,'Prism · PR-001','Électronique','spectral','A1|Spectral|6:12;B1|Refraction|5:48;B2|White Light|7:30'],
 ['d16','Ondes Mécaniques','Synthèse',1981,'Ondes · OM-81','Électronique','synth','A1|Synthèse|4:40;A2|Oscillateur|3:55;B1|Ruban|5:10']
].map(([id,a,t,y,l,g,c,tr]) => ({id,a,t,y,l,g,css:C[c],tr:T(tr)}));
const SEED = {
 'd1:0':{s:4,b:76,src:'GetSongBPM',k:'Am',m:['Ouverture'],c:'L’intro qui met tout le monde d’accord.'},
 'd1:1':{s:3,b:80,src:'GetSongBPM'},
 'd1:2':{s:4,b:74,src:'GetSongBPM',k:'Am',m:['Montée','Pic'],c:'Basse énorme, le mélodica arrive à 1:40. Parfait pour faire monter après une intro roots.',set:true},
 'd2:2':{s:5,b:72,src:'Micro',m:['Pic','Rewind'],c:'Le rewind obligatoire.',set:true},
 'd3:0':{s:4,b:84,src:'GetSongBPM',m:['Montée'],set:true},
 'd6:0':{s:5,b:88,src:'Tempo tapé',m:['Pic'],c:'Steppers parfait pour finir la montée.'},
 'd7:2':{s:5,b:78,src:'GetSongBPM',m:['Fin de soirée'],c:'À garder pour la toute fin.'},
 'd9:0':{s:4,b:62,src:'GetSongBPM',m:['Ouverture']},
 'd11:2':{s:4,b:104,src:'GetSongBPM'},
 'd13:0':{s:5,b:112,src:'GetSongBPM',m:['Pic']}
};

/* ---------- État ---------- */
const ls = {
 get(k, d){ try { const v = localStorage.getItem('dc.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
 set(k, v){ try { localStorage.setItem('dc.' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = Object.assign({ mode:'demo', user:'', token:'', gsb:'', audd:'' }, ls.get('settings', {}));
if (LIMITED) S.mode = 'demo';
let NOTES = ls.get('notes', null) || JSON.parse(JSON.stringify(SEED));
let LIB = S.mode === 'discogs' ? (ls.get('lib', []) || []) : DEMO;
const crateIdx = {};
const sys = { r:0, min:0, m:'' };

let dbDoc = null, writing = Promise.resolve(), remoteTimer = 0;
function saveNotes(){
 ls.set('notes', NOTES);
 if (!dbDoc) return;
 clearTimeout(remoteTimer);
 remoteTimer = setTimeout(() => { writing = writing.then(() => dbDoc.set({ notes: NOTES, t: Date.now() })).catch(() => {}); }, 900);
}
function saveSettings(){ ls.set('settings', S); }
function saveLib(){ if (S.mode === 'discogs') ls.set('lib', LIB); }

const key = (rid, i) => rid + ':' + i;
const note = k => NOTES[k] || {};
function setNote(k, patch){
 const n = Object.assign({}, note(k), patch, { t: Date.now() });
 NOTES[k] = n; saveNotes(); flash('Enregistré');
}
let toastT = 0;
function flash(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1400); }

/* ---------- Helpers ---------- */
const byId = id => LIB.find(r => r.id === id);
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'divers';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function hue(id){ let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function coverCss(r){ if (r.css) return r.css; const h = hue(r.id); return `radial-gradient(circle at 30% 35%,hsl(${h} 60% 55%) 0 24%,transparent 24.5%),linear-gradient(hsl(${(h+140)%360} 40% 22%) 0 62%,hsl(${(h+40)%360} 55% 45%) 62%)`; }
function cover(r, px, extra){
 const img = r.img && !LIMITED ? `<img src="${esc(r.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '';
 return `<div class="cv" style="width:${px}px;height:${px}px;background:${coverCss(r)};${extra||''}" aria-hidden="true">${img}</div>`;
}
const starTxt = s => s ? '★'.repeat(s) + '☆'.repeat(5 - s) : '';
const starSvg = on => `<svg viewBox="0 0 24 24" fill="${on ? '#efe6d2' : 'none'}" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z"/></svg>`;
function bins(){
 const m = new Map();
 for (const r of LIB) { const g = r.g || 'Divers'; if (!m.has(g)) m.set(g, []); m.get(g).push(r); }

/* ---------- Détection du tempo ---------- */
async function analyze(ab){
 const AC = window.AudioContext || window.webkitAudioContext;
 const ac = new AC(); const buf = await ac.decodeAudioData(ab); if (ac.close) ac.close();
 const sr = buf.sampleRate, len = Math.min(buf.length, Math.round(sr * 40));
 const off = new OfflineAudioContext(1, len, sr), src = off.createBufferSource(), lp = off.createBiquadFilter();
 src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 200; src.connect(lp); lp.connect(off.destination); src.start(0);
 const d = (await off.startRendering()).getChannelData(0);
 const rate = 200, hop = Math.round(sr / rate), n = Math.floor(d.length / hop);
 if (n < rate * 4) throw new Error('Enregistrement trop court (4 s minimum)');
 const e = new Float32Array(n);
 for (let i = 0; i < n; i++) { let s = 0; for (let j = i * hop, z = j + hop; j < z; j++) s += d[j] * d[j]; e[i] = Math.log(1e-8 + s); }
 const on = new Float32Array(n); let mean = 0;
 for (let i = 2; i < n; i++) { on[i] = Math.max(0, e[i] - (e[i - 1] + e[i - 2]) / 2); mean += on[i]; }
 mean /= n; for (let i = 0; i < n; i++) on[i] -= mean;
 const lo = Math.floor(rate * 60 / 180), hi = Math.ceil(rate * 60 / 55), ac2 = [];
 let best = lo, bv = -Infinity, sum = 0;
 for (let L = lo; L <= hi; L++) {
  let s = 0; for (let i = 0; i + L < n; i++) s += on[i] * on[i + L];
  const bpm = rate * 60 / L, w = Math.exp(-0.5 * (Math.log2(bpm / 100) / 0.9) ** 2);
  ac2[L] = s; sum += s; if (s * w > bv) { bv = s * w; best = L; }
 }
 const a = ac2[best - 1] ?? ac2[best], b = ac2[best], c = ac2[best + 1] ?? ac2[best];
 const shift = (a - 2 * b + c) ? 0.5 * (a - c) / (a - 2 * b + c) : 0;
 const bpm = rate * 60 / (best + shift), conf = b / (sum / (hi - lo + 1) || 1);
 return { b: Math.round(bpm), alt: Math.round(bpm < 95 ? bpm * 2 : bpm / 2), conf: conf > 2.2 ? 'élevée' : conf > 1.5 ? 'moyenne' : 'faible' };
}
async function recordMic(sec, tick){
 const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
 const rec = new MediaRecorder(st), ch = [];
 rec.ondataavailable = ev => ch.push(ev.data); rec.start();
 for (let s = sec; s > 0; s--) { tick(s); await new Promise(r => setTimeout(r, 1000)); }
 const stopped = new Promise(r => rec.onstop = r); rec.stop(); await stopped; st.getTracks().forEach(t => t.stop());

}

 const fd = new FormData(); fd.append('api_token', S.audd); fd.append('file', blob, 'ecoute.webm');

}

  tool.onclick = e => { const b = e.target.closest('[data-b]'); if (!b) return; putBpm(+b.dataset.b, src); tool.innerHTML = ''; };
 };
 const gsb = $('#gsb');
 if (gsb) gsb.onclick = async () => { gsb.disabled = true; gsb.textContent = 'Recherche…'; try { const x = await gsbLookup(r, t); putBpm(x.b, 'GetSongBPM', { k: x.k }); } catch (e) { flash(e.message); } gsb.disabled = false; gsb.textContent = 'Chercher sur GetSongBPM'; };
 const mic = $('#mic');
 if (mic) mic.onclick = async () => {
  tool.innerHTML = `<div class="listen" aria-hidden="true"><i></i><i></i><i></i><b id="cd">12</b></div><p class="small mut" style="text-align:center;margin:0">J’écoute la platine… approche le téléphone de l’enceinte. Le son reste sur ton appareil.</p>`;
  try { const blob = await recordMic(12, s => { const c = $('#cd'); if (c) c.textContent = s; }); tool.innerHTML = '<p class="small mut">Calcul du tempo…</p>'; result(await analyze(await blob.arrayBuffer()), 'Mesuré au micro'); }
  catch (e) { tool.innerHTML = `<p class="small mut">${esc(e.name === 'NotAllowedError' ? 'Accès au micro refusé.' : e.message)}</p>`; }
 };
 $('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  tool.innerHTML = '<p class="small mut" style="margin-top:14px">Analyse de l’enregistrement…</p>';
  try { result(await analyze(await f.arrayBuffer()), 'Analysé sur un enregistrement'); } catch (err) { tool.innerHTML = `<p class="small mut" style="margin-top:14px">${esc(err.message || 'Fichier illisible')}</p>`; }
  e.target.value = '';
 };
 $('#tapo').onclick = () => {
  let taps = [];
  tool.innerHTML = `<button class="tapbox" id="tap" style="margin-top:16px">Tape ici au rythme du morceau<br><span id="tapv" style="font:400 40px var(--serif)">—</span></button><div class="pills" style="margin-top:10px"><button class="btn" id="tapk" disabled>Garder ce tempo</button><button class="btn2" id="tapr">Recommencer</button></div>`;
  const live = () => { if (taps.length < 3) return 0; const iv = []; for (let j = 1; j < taps.length; j++) iv.push(taps[j] - taps[j - 1]); iv.sort((a, b) => a - b); return 60000 / iv[Math.floor(iv.length / 2)]; };
  $('#tap').onpointerdown = () => { const now = performance.now(); if (taps.length && now - taps[taps.length - 1] > 2000) taps = []; taps.push(now); taps = taps.slice(-12); const v = live(); $('#tapv').textContent = v ? Math.round(v) : '…'; $('#tapk').disabled = !v; };
  $('#tapr').onclick = () => { taps = []; $('#tapv').textContent = '—'; $('#tapk').disabled = true; };
  $('#tapk').onclick = () => { putBpm(live(), 'Tempo tapé'); tool.innerHTML = ''; };
 };
}

function vSysteme(){
 const R = [['Tous',0,999],['60–80',60,80],['80–100',80,100],['100–120',100,120],['120 +',120,999]];
 const [, lo, hi] = R[sys.r];
 const rows = allTracks().filter(x => (x.n.s || x.n.b)).filter(x => (!x.n.b ? sys.r === 0 : x.n.b >= lo && x.n.b < hi) && (x.n.s || 0) >= sys.min && (!sys.m || (x.n.m || []).includes(sys.m))).sort((a, b) => (a.n.b || 999) - (b.n.b || 999));
 const chosen = allTracks().filter(x => x.n.set).sort((a, b) => (a.n.b || 999) - (b.n.b || 999));
 const bp = chosen.map(x => x.n.b).filter(Boolean), discs = new Map();
 chosen.forEach(x => { if (!discs.has(x.r.id)) discs.set(x.r.id, { r: x.r, p: [] }); discs.get(x.r.id).p.push(x.t.p); });
 V.innerHTML = `
 <p class="lab">Dans tes titres notés</p><h1 style="margin-top:6px">Préparer un <i class="s">système</i></h1>
 <div class="grid2" style="margin-top:26px">
 <div>
  <p class="lab" style="margin-bottom:8px">Tempo</p><div class="pills" role="radiogroup" aria-label="Tempo" id="fr">${R.map(([l], j) => `<button class="pill" role="radio" aria-checked="${j === sys.r}" data-j="${j}">${l}</button>`).join('')}</div>
  <p class="lab" style="margin:14px 0 8px">Note minimale</p><div class="pills" role="radiogroup" aria-label="Note minimale" id="fs">${[[0,'Toutes'],[3,'★ 3 et +'],[4,'★ 4 et +'],[5,'★ 5']].map(([v, l]) => `<button class="pill" role="radio" aria-checked="${v === sys.min}" data-v="${v}">${l}</button>`).join('')}</div>
  <p class="lab" style="margin:14px 0 8px">Moment</p><div class="pills" id="fm">${['', ...MOMENTS].map(m => `<button class="pill" aria-pressed="${m === sys.m}" data-m="${esc(m)}">${m ? esc(m) : 'Tous'}</button>`).join('')}</div>
  <p class="small dim" style="margin:20px 0 8px">${rows.length} titre${rows.length > 1 ? 's' : ''} correspondent</p>
  <ul class="list" id="rows">${rows.map(x => `<li style="display:grid;grid-template-columns:52px minmax(0,1fr) 46px;gap:12px;align-items:center;min-height:68px">
   <span style="font:400 28px/1 var(--serif)">${x.n.b ? esc(x.n.b) : '—'}</span>
   <a href="#titre-${esc(x.r.id)}-${x.i}" style="text-decoration:none"><span class="ell" style="display:block;font-size:16px;font-weight:400">${esc(x.t.n)}</span><span class="ell small mut" style="display:block"><span style="letter-spacing:.1em">${starTxt(x.n.s)}</span> ${esc(x.r.t)} · ${esc(x.t.p)}${x.n.c ? ' · « ' + esc(x.n.c) + ' »' : ''}</span></a>
   <button class="ico ${x.n.set ? 'on' : ''}" data-k="${esc(x.k)}" aria-label="${x.n.set ? 'Retirer' : 'Ajouter'} ${esc(x.t.n)}">${x.n.set ? '✓' : '+'}</button></li>`).join('') || '<li class="note" style="padding:16px 0">Aucun titre noté ne correspond. Note des titres depuis tes bacs.</li>'}</ul>
 </div>
 <aside style="align-self:start;padding:22px;border-radius:16px;background:var(--card);border:1px solid #232120">
  <h2>Mon système</h2>
  <p class="small mut" style="margin:6px 0 16px">${chosen.length ? `${chosen.length} titre${chosen.length > 1 ? 's' : ''}${bp.length ? ' · ' + Math.min(...bp) + '–' + Math.max(...bp) + ' BPM' : ''} · ${discs.size} disque${discs.size > 1 ? 's' : ''} à sortir` : 'Ajoute des titres avec le bouton +.'}</p>
  <ol class="list">${chosen.map(x => `<li style="display:flex;gap:12px;align-items:baseline;padding:10px 0"><span style="font:400 22px var(--serif);width:40px">${x.n.b || '—'}</span><span class="ell" style="flex:1">${esc(x.t.n)} <span class="small dim">${esc(x.r.t)} · ${esc(x.t.p)}</span></span></li>`).join('')}</ol>
  ${discs.size ? `<p class="lab" style="margin:18px 0 8px">Disques à sortir</p><ul style="list-style:none;margin:0;padding:0">${[...discs.values()].map(d => `<li style="display:flex;gap:10px;align-items:center;padding:6px 0">${cover(d.r, 36)}<span class="ell small">${esc(d.r.t)} <span class="dim">· ${esc(d.p.join(', '))}</span></span></li>`).join('')}</ul>
  <div class="pills" style="margin-top:18px"><button class="btn" id="copy">Copier la liste</button><button class="btn2" id="clear">Vider</button></div>` : ''}
 </aside>
 </div>`;
 $('#fr').onclick = e => { const b = e.target.closest('button'); if (b) { sys.r = +b.dataset.j; vSysteme(); } };
 $('#fs').onclick = e => { const b = e.target.closest('button'); if (b) { sys.min = +b.dataset.v; vSysteme(); } };
 $('#fm').onclick = e => { const b = e.target.closest('button'); if (b) { sys.m = b.dataset.m; vSysteme(); } };
 $('#rows').onclick = e => { const b = e.target.closest('button[data-k]'); if (!b) return; setNote(b.dataset.k, { set: !note(b.dataset.k).set }); vSysteme(); };
 const cp = $('#copy');
 if (cp) cp.onclick = async () => { const txt = 'Système — ' + chosen.length + ' titres\n' + chosen.map(x => `${x.n.b || '—'} BPM · ${x.t.n} — ${x.r.a} (${x.r.t}, ${x.t.p})${x.n.c ? ' · ' + x.n.c : ''}`).join('\n'); try { await navigator.clipboard.writeText(txt); flash('Liste copiée'); } catch (e) { flash('Copie refusée par le navigateur'); } };
 const cl = $('#clear');
 if (cl) cl.onclick = () => { if (cl.dataset.ok) { chosen.forEach(x => { NOTES[x.k] = Object.assign({}, x.n, { set: false, t: Date.now() }); }); saveNotes(); vSysteme(); } else { cl.dataset.ok = 1; cl.textContent = 'Confirmer'; } };
}

function vProfil(){
 const tr = allTracks();
 V.innerHTML = `
 <div style="max-width:720px">
 <h1>Profil</h1>
 <dl style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
  ${[[LIB.length,'disques'],[tr.filter(x => x.n.s).length,'titres notés'],[tr.filter(x => x.n.b).length,'BPM connus'],[tr.filter(x => x.n.c).length,'commentaires']].map(([v, l]) => `<div style="display:flex;flex-direction:column-reverse;justify-content:flex-end"><dt class="small mut">${l}</dt><dd style="margin:0;font:400 clamp(28px,5vw,36px)/1 var(--serif)">${v}</dd></div>`).join('')}
 </dl>
 <h2 class="sec">Discogs</h2>
 ${CAN_NET ? `
  <p class="small mut" style="margin:8px 0 0">${S.mode === 'discogs' ? `Relié à <b style="color:var(--ink);font-weight:500">${esc(S.user)}</b> · ${LIB.length} disques.` : 'Tu es sur la collection de démonstration.'} Crée un jeton personnel dans Discogs, Paramètres › Développeurs. Il reste dans ce navigateur.</p>
  <form id="dform"><label class="field"><span>Nom d’utilisateur Discogs</span><input class="in" id="du" autocomplete="username" value="${esc(S.user)}" required></label>
  <label class="field"><span>Jeton personnel</span><input class="in" id="dt" type="password" autocomplete="off" value="${esc(S.token)}" required></label>
  <div class="pills" style="margin-top:16px"><button class="btn" type="submit">${S.mode === 'discogs' ? 'Resynchroniser' : 'Relier ma collection'}</button>${S.mode === 'discogs' ? '<button class="btn2" type="button" id="demo">Revenir à la démo</button>' : ''}</div>
  <p class="small mut" id="dst" style="margin:12px 0 0"></p></form>`
 : `<p class="small mut" style="margin:8px 0 0;max-width:60ch">Ici, sur claude.ai, la page ne peut joindre aucun service extérieur : tu testes l’appli sur la collection de démonstration, et tes notes sont bien enregistrées. Pour brancher ta vraie collection Discogs, GetSongBPM et le micro, ouvre la même appli hébergée sur ton propre site.</p>`}
 <h2 class="sec">Tempo et reconnaissance</h2>
 ${CAN_NET ? `<label class="field"><span>Clé API GetSongBPM</span><input class="in" id="gk" type="password" autocomplete="off" value="${esc(S.gsb)}" placeholder="Obtenue sur getsongbpm.com/api"></label>
 <label class="field"><span>Jeton AudD, pour reconnaître le titre qui tourne (facultatif)</span><input class="in" id="ak" type="password" autocomplete="off" value="${esc(S.audd)}" placeholder="Obtenu sur audd.io"></label>
 <p class="small mut" style="margin:10px 0 0">Micro : ${CAN_MIC ? 'disponible. Il ne s’active que quand tu touches « Mesurer au micro » ou « Reconnaître ».' : 'indisponible dans ce navigateur (il faut une adresse en https).'}</p>` : `<p class="small mut" style="margin:8px 0 0">Ici : analyse d’un enregistrement et tempo tapé. Version hébergée : recherche GetSongBPM, mesure au micro et reconnaissance du titre.</p>`}
 <div style="margin-top:22px;padding:16px;border-radius:14px;border:1px solid var(--line)"><p class="lab">Sources</p><p style="margin:6px 0 0">Tempo et tonalité fournis par <a href="https://getsongbpm.com" style="font-weight:500;text-underline-offset:3px">GetSongBPM.com</a></p><p class="small dim" style="margin:4px 0 0">Collection et pochettes via Discogs. Reconnaissance des titres via AudD.</p></div>
 <h2 class="sec">Sauvegarde</h2>
 <p class="small mut" style="margin:8px 0 0">${dbDoc ? 'Tes notes sont enregistrées dans ton espace privé de cette page, et dans ce navigateur.' : 'Tes notes sont enregistrées dans ce navigateur.'} Copie-les pour les passer d’une version à l’autre.</p>
 <div class="pills" style="margin-top:14px"><button class="btn2" id="exp">Copier mes notes</button><button class="btn2" id="impB">Coller des notes</button><button class="btn2" id="wipe">Effacer mes notes</button></div>
 <div id="impZ"></div>
 </div>`;
 const f = $('#dform');
 if (f) f.onsubmit = async e => {
  e.preventDefault(); S.user = $('#du').value.trim(); S.token = $('#dt').value.trim(); saveSettings();
  const st = $('#dst'); st.textContent = 'Connexion à Discogs…';
  try { const lib = await importDiscogs(m => st.textContent = m); const old = new Map(LIB.map(r => [r.id, r])); LIB = lib.map(r => old.get(r.id)?.tr ? Object.assign(r, { tr: old.get(r.id).tr }) : r); S.mode = 'discogs'; saveSettings(); saveLib(); st.textContent = `${LIB.length} disques rangés dans tes bacs.`; setMode(); }
  catch (err) { st.textContent = err.message === 'Failed to fetch' ? 'Discogs injoignable depuis cette adresse.' : err.message; }
 };
 const dm = $('#demo'); if (dm) dm.onclick = () => { S.mode = 'demo'; LIB = DEMO; saveSettings(); setMode(); vProfil(); };
 const gk = $('#gk'); if (gk) gk.onchange = () => { S.gsb = gk.value.trim(); saveSettings(); flash('Clé enregistrée'); };
 const ak = $('#ak'); if (ak) ak.onchange = () => { S.audd = ak.value.trim(); saveSettings(); flash('Jeton enregistré'); };
 $('#exp').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify({ discollection: 1, notes: NOTES })); flash('Notes copiées'); } catch (e) { flash('Copie refusée par le navigateur'); } };
 $('#impB').onclick = () => {
  $('#impZ').innerHTML = `<label class="field"><span>Colle ici des notes copiées depuis Discollection</span><textarea class="in" id="impT"></textarea></label><button class="btn" id="impG" style="margin-top:10px">Importer</button>`;
  $('#impG').onclick = () => { try { const j = JSON.parse($('#impT').value); if (!j || typeof j.notes !== 'object') throw 0; for (const [k, v] of Object.entries(j.notes)) if (v && typeof v === 'object' && (!NOTES[k] || (v.t || 0) >= (NOTES[k].t || 0))) NOTES[k] = v; saveNotes(); flash('Notes importées'); vProfil(); } catch (e) { flash('Texte non reconnu'); } };
 };
 const w = $('#wipe'); w.onclick = () => { if (w.dataset.ok) { NOTES = {}; saveNotes(); flash('Notes effacées'); vProfil(); } else { w.dataset.ok = 1; w.textContent = 'Confirmer l’effacement'; } };
}

async function recognizeFlow(){
 V.innerHTML = `<div style="max-width:560px;margin:0 auto;text-align:center"><a class="btn2" href="#bacs">Annuler</a><div class="listen" aria-hidden="true"><i></i><i></i><i></i><b id="cd">12</b></div><h1>J’écoute <i class="s">la platine…</i></h1><p class="mut" id="rst">Approche ton téléphone de l’enceinte. Environ 12 s de son sont envoyées à AudD pour reconnaître le titre.</p></div>`;
 try {
  const blob = await recordMic(12, s => { const c = $('#cd'); if (c) c.textContent = s; });
  $('#rst').textContent = 'Reconnaissance et calcul du tempo…';
  const [rec, tempo] = await Promise.all([auddRecognize(blob), analyze(await blob.arrayBuffer()).catch(() => null)]);
  const hit = await matchInLib(rec);
  if (!hit) { $('#rst').textContent = `C’est « ${rec.title} » de ${rec.artist}, mais ce titre n’est pas dans ta collection.`; return; }
  const k = key(hit.r.id, hit.i);
  if (tempo && !note(k).b) setNote(k, { b: tempo.b, src: 'Mesuré au micro' });
  location.hash = `titre-${hit.r.id}-${hit.i}`;
 } catch (e) { const r = $('#rst'); if (r) r.textContent = e.name === 'NotAllowedError' ? 'Accès au micro refusé.' : (e.message === 'Failed to fetch' ? 'AudD injoignable depuis cette adresse.' : e.message); }
}

/* ---------- Routeur ---------- */
function setMode(){ $('#modeTag').textContent = S.mode === 'demo' ? 'Démo' : ''; }
function route(){
 const h = location.hash.slice(1) || 'bacs'; let m;
 const tab = h.startsWith('systeme') ? 'systeme' : h.startsWith('profil') ? 'profil' : 'bacs';
 document.querySelectorAll('[data-tab]').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
 window.scrollTo(0, 0); bacGo = null;
 if (h === 'systeme') vSysteme();
 else if (h === 'profil') vProfil();
 else if (m = h.match(/^bac-([a-z0-9-]+)$/)) vBac(m[1]);
 else if (m = h.match(/^disque-([a-z0-9]+)$/i)) vDisque(m[1]);
 else if (m = h.match(/^titre-([a-z0-9]+)-(\d+)$/i)) { const r = byId(m[1]); if (r && !r.tr) loadTracks(r).then(() => vTitre(m[1], +m[2])).catch(() => vDisque(m[1])); else vTitre(m[1], +m[2]); }
 else vBacs();
}
addEventListener('hashchange', route);
setMode(); route();

/* ---------- Espace privé claude.ai ---------- */
(async () => {
 if (!window.claude || typeof window.claude.use !== 'function') return;
 try {
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id(); if (!uid) return;
  const ref = db.collection('data/users/' + uid).doc('discollection');
  const snap = await ref.get();
  if (snap.exists) {
   const remote = (snap.data() || {}).notes || {};
   for (const [k, v] of Object.entries(remote)) if (v && (!NOTES[k] || (v.t || 0) > (NOTES[k].t || 0))) NOTES[k] = v;
   ls.set('notes', NOTES);
  }
  dbDoc = ref;
  if (!snap.exists) saveNotes();
  const h = location.hash.slice(1);
  if (!/^titre-/.test(h)) route();
 } catch (e) {}
})();
}
</script>
